apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoplite.fullname" . }}-redis
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "shoplite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: queue
