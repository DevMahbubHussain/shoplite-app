apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shoplite.fullname" . }}-config
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: "INFO"
  PORT: "8000"
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_HOST: "{{ include "shoplite.fullname" . }}-postgres"
  POSTGRES_PORT: {{ .Values.postgresql.service.port | quote }}
  REDIS_HOST: "{{ include "shoplite.fullname" . }}-redis"
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  REDIS_URL: "redis://{{ include "shoplite.fullname" . }}-redis:{{ .Values.redis.service.port }}/0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4317"
