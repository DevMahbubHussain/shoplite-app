{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "shoplite.fullname" . }}-catalog-api-pdb
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-api
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: catalog-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "shoplite.fullname" . }}-order-worker-pdb
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: order-worker
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: order-worker
{{- end }}
