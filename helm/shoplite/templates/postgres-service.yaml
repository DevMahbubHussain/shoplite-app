apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoplite.fullname" . }}-postgres
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    {{- include "shoplite.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
