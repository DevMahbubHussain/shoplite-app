name: ShopLite CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'helm/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'helm/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-catalog-api:
    name: Test Catalog API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/catalog-api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/catalog-api/requirements.txt pytest pytest-asyncio

      - name: Run Catalog API Unit Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest services/catalog-api/tests -v --durations=10

  test-order-worker:
    name: Test Order Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/order-worker/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/order-worker/requirements.txt pytest pytest-asyncio

      - name: Run Order Worker Unit Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest services/order-worker/tests -v --durations=10

  lint-helm-chart:
    name: Lint & Template Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint ShopLite Helm Chart
        run: |
          helm lint helm/shoplite

      - name: Dry-Run Template Rendering (Dev & Prod)
        run: |
          helm template test-dev helm/shoplite -f helm/shoplite/values-dev.yaml > /dev/null
          helm template test-prod helm/shoplite -f helm/shoplite/values-prod.yaml > /dev/null

  security-scan:
    name: Build & Scan Container Images (Trivy)
    needs:
      - test-catalog-api
      - test-order-worker
      - lint-helm-chart
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: catalog-api
            context: services/catalog-api
          - name: order-worker
            context: services/order-worker
          - name: web
            context: services/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          load: true
          tags: shoplite-${{ matrix.service.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shoplite-${{ matrix.service.name }}:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
