name: ShopLite CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'helm/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'helm/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-catalog-api:
    name: Test Catalog API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/catalog-api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/catalog-api/requirements.txt pytest pytest-asyncio

      - name: Run Catalog API Unit Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest services/catalog-api/tests -v --durations=10

  test-order-worker:
    name: Test Order Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/order-worker/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/order-worker/requirements.txt pytest pytest-asyncio

      - name: Run Order Worker Unit Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest services/order-worker/tests -v --durations=10

  lint-helm-chart:
    name: Lint & Template Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint ShopLite Helm Chart
        run: |
          helm lint helm/shoplite

      - name: Dry-Run Template Rendering (Dev & Prod)
        run: |
          helm template test-dev helm/shoplite -f helm/shoplite/values-dev.yaml > /dev/null
          helm template test-prod helm/shoplite -f helm/shoplite/values-prod.yaml > /dev/null

  security-scan:
    name: Build & Scan Container Images (Trivy)
    needs:
      - test-catalog-api
      - test-order-worker
      - lint-helm-chart
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: catalog-api
            context: services/catalog-api
          - name: order-worker
            context: services/order-worker
          - name: web
            context: services/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          load: true
          tags: shoplite-${{ matrix.service.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shoplite-${{ matrix.service.name }}:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    name: Build & Push Images to Amazon ECR
    needs:
      - security-scan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: catalog-api
            repo: shoplite-catalog-api
            context: services/catalog-api
          - name: order-worker
            repo: shoplite-order-worker
            context: services/order-worker
          - name: web
            repo: shoplite-web
            context: services/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::263303066497:role/shoplite-github-actions-role' }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          role-session-name: shoplite-ecr-publish

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Short Git SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Container Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.repo }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.repo }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-gitops:
    name: Promote Container Images to GitOps (Dev)
    needs:
      - build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Extract Short Git SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: DevMahbubHussain/shoplite-gitops
          token: ${{ secrets.GITOPS_REPO_PAT || github.token }}
          path: shoplite-gitops
          ref: main

      - name: Update Image Tags in Dev Values
        working-directory: shoplite-gitops
        env:
          NEW_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          echo "Updating ShopLite microservice tags to: ${NEW_TAG}"
          if command -v yq >/dev/null 2>&1; then
            yq eval ".catalogApi.image.tag = \"${NEW_TAG}\"" -i envs/dev/values.yaml
            yq eval ".orderWorker.image.tag = \"${NEW_TAG}\"" -i envs/dev/values.yaml
            yq eval ".web.image.tag = \"${NEW_TAG}\"" -i envs/dev/values.yaml
          else
            sed -i "s/tag: .*/tag: \"${NEW_TAG}\"/g" envs/dev/values.yaml
          fi
          git diff envs/dev/values.yaml

      - name: Commit and Push to GitOps Repository
        working-directory: shoplite-gitops
        env:
          NEW_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add envs/dev/values.yaml
          if git diff --staged --quiet; then
            echo "No changes in values.yaml, skipping commit."
          else
            git commit -m "deploy(dev): promote container images to ${NEW_TAG} [skip ci]"
            git push origin main
          fi


