name: ShopLite Pull Request Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'helm/**'
      - 'terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-catalog-api:
    name: Test Catalog API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/catalog-api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/catalog-api/requirements.txt pytest pytest-asyncio

      - name: Run Catalog API Unit Tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest services/catalog-api/tests -v --durations=10

  test-order-worker:
    name: Test Order Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/order-worker/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/order-worker/requirements.txt pytest pytest-asyncio

      - name: Run Order Worker Unit Tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest services/order-worker/tests -v --durations=10

  lint-helm-chart:
    name: Lint & Template Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint ShopLite Helm Chart
        run: |
          helm lint helm/shoplite

      - name: Dry-Run Template Rendering (Dev & Prod)
        run: |
          helm template test-dev helm/shoplite -f helm/shoplite/values-dev.yaml > /dev/null
          helm template test-prod helm/shoplite -f helm/shoplite/values-prod.yaml > /dev/null

  security-scan:
    name: Build & Scan Container Images (Trivy)
    needs:
      - test-catalog-api
      - test-order-worker
      - lint-helm-chart
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: catalog-api
            context: services/catalog-api
          - name: order-worker
            context: services/order-worker
          - name: web
            context: services/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          load: true
          tags: shoplite-${{ matrix.service.name }}:pr-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shoplite-${{ matrix.service.name }}:pr-scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  terraform-check:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'

      - name: Terraform Format Check
        id: fmt
        run: terraform -chdir=terraform fmt -check
        continue-on-error: true

      - name: Terraform Init (Local Backend Only)
        id: init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=terraform validate -no-color

      - name: Generate Terraform Plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: mock_key
          AWS_SECRET_ACCESS_KEY: mock_secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "### Terraform Plan Simulation" > plan.txt
          terraform -chdir=terraform plan -no-color -refresh=false >> plan.txt 2>&1 || true
          cat plan.txt

      - name: Comment Plan Output on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('plan.txt', 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) + '\n... [truncated]';
              }
            } catch (err) {
              planOutput = 'Error reading plan output.';
            }

            const output = `#### Terraform Format & Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖
            <details><summary>Show Plan</summary>

            \`\`\`terraform\n
            ${planOutput}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
