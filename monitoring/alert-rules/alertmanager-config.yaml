# Alertmanager Configuration for ShopLite On-Call Routing
# Target: monitoring namespace Alertmanager ConfigSecret
global:
  resolve_timeout: 5m

route:
  receiver: shoplite-oncall
  group_by:
    - alertname
    - service
    - namespace
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = Critical
      receiver: shoplite-oncall-critical
      repeat_interval: 1h

receivers:
  - name: shoplite-oncall
    webhook_configs:
      - url: "http://alert-webhook.monitoring.svc.cluster.local:5001/webhook"
        send_resolved: true

  - name: shoplite-oncall-critical
    webhook_configs:
      - url: "http://alert-webhook.monitoring.svc.cluster.local:5001/critical"
        send_resolved: true
