# ShopLite Kubernetes Cluster Inventory (ap-southeast-1, account 904907793701)
# Nodes reside in private subnets with zero public IPs; Ansible connects via AWS SSM.

all:
  children:
    control_plane:
      hosts:
        shoplite-control-plane:
          instance_id: i-0428f398a5508c587
          ansible_aws_ssm_instance_id: i-0428f398a5508c587
          internal_ip: 10.0.10.5
          node_role: control-plane

    workers:
      hosts:
        shoplite-worker-1:
          instance_id: i-090c9fe3973ffa5ff
          ansible_aws_ssm_instance_id: i-090c9fe3973ffa5ff
          internal_ip: 10.0.10.157
          node_role: worker

        shoplite-worker-2:
          instance_id: i-068002d9a8b4ffd01
          ansible_aws_ssm_instance_id: i-068002d9a8b4ffd01
          internal_ip: 10.0.20.225
          node_role: worker

    k8s_cluster:
      children:
        control_plane:
        workers:
      vars:
        ansible_connection: amazon.aws.aws_ssm
        ansible_aws_ssm_region: ap-southeast-1
        ansible_aws_ssm_bucket_name: shoplite-ansible-artifacts-904907793701
        ansible_aws_ssm_plugin: /home/mahbub/.local/bin/session-manager-plugin
        ansible_aws_ssm_retries: 3
        ansible_aws_ssm_timeout: 300
        ansible_python_interpreter: /usr/bin/python3
        pod_network_cidr: 192.168.0.0/16
        k8s_version: "1.29"
        cni_plugin: calico
        apiserver_port: 6443
