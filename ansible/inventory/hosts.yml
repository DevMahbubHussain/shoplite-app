# ShopLite Production Kubernetes Cluster Inventory
# Configured with Live AWS EC2 Private Nodes in Singapore (ap-southeast-1)

all:
  children:
    control_plane:
      hosts:
        shoplite-control-plane:
          ansible_host: 10.0.10.197
          instance_id: i-054833e78a1497e80
          internal_ip: 10.0.10.197
          node_role: control-plane

    workers:
      hosts:
        shoplite-worker-1:
          ansible_host: 10.0.10.9
          instance_id: i-0bc830a92f49d39a4
          internal_ip: 10.0.10.9
          node_role: worker

        shoplite-worker-2:
          ansible_host: 10.0.20.236
          instance_id: i-0b78d3ea2b187f0b4
          internal_ip: 10.0.20.236
          node_role: worker

    k8s_cluster:
      children:
        control_plane:
        workers:
      vars:
        ansible_user: ubuntu
        ansible_python_interpreter: /usr/bin/python3
        pod_network_cidr: 192.168.0.0/16
        k8s_version: "1.29"
        cni_plugin: calico
        apiserver_port: 6443
