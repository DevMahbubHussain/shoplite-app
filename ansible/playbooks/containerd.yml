---
# ShopLite Container Runtime (containerd) Installation & Kernel Tuning Playbook
# Configures kernel modules, network bridging, disables swap, and tunes containerd SystemdCgroup

- name: Install and Configure containerd Container Runtime
  hosts: k8s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: 1. Configure kernel modules required by Kubernetes CNI
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: '0644'

    - name: 2. Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: 3. Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: 4. Configure sysctl network parameters for packet filtering and forwarding
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        state: present
        reload: true
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }

    - name: 5. Disable active swap memory (mandatory for Kubelet)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: 6. Remove swap entries from /etc/fstab to persist across reboots
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]+\s+[^#\s]+\s+swap\s+.*)$'
        replace: '# \1'

    - name: 7. Install prerequisite packages for containerd repository
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: 8. Create directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 9. Download Docker / containerd official GPG signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false

    - name: 10. Add Docker / containerd official apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: 11. Install containerd.io package
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: 12. Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: 13. Generate default containerd config.toml if missing
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: 14. Configure SystemdCgroup = true for runc runtime
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '(\s*SystemdCgroup\s*=\s*)false'
        replace: '\1true'
      notify: Restart containerd

    - name: 15. Ensure containerd service is enabled and running
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
