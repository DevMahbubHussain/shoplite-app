---
# ShopLite Kubeconfig Retrieval Playbook
# Securely copies /etc/kubernetes/admin.conf from control plane to local workstation

- name: Retrieve Admin Kubeconfig from Control Plane
  hosts: control_plane
  become: true
  gather_facts: false

  vars:
    local_kubeconfig_path: "{{ playbook_dir }}/../kubeconfig"

  tasks:
    - name: Fetch admin.conf to operator workstation
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ local_kubeconfig_path }}"
        flat: true
        mode: '0600'

    - name: Display cluster access instructions
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " Kubeconfig successfully retrieved!"
          - " Saved to: {{ local_kubeconfig_path }}"
          - " To interact with the cluster:"
          - " export KUBECONFIG={{ local_kubeconfig_path }}"
          - " kubectl get nodes -o wide"
          - "=========================================================="
