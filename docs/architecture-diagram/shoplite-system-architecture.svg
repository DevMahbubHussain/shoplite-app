<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGradBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f2038" />
    </linearGradient>
    <linearGradient id="cardGradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="cardGradPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b1d64" />
      <stop offset="100%" stop-color="#24103e" />
    </linearGradient>
    <linearGradient id="cardGradOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2e17" />
      <stop offset="100%" stop-color="#3b1c0b" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb923c" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="60" y="45" fill="url(#headerGrad)" font-size="26" font-weight="800" letter-spacing="0.5">ShopLite — Full System Architecture Topology</text>
  <text x="60" y="70" fill="#94a3b8" font-size="13">High-Throughput Microservices · Multi-AZ AWS VPC · GitOps Delivery · Distributed Observability</text>

  <!-- BOUNDING BOX: AWS Custom VPC -->
  <rect x="40" y="90" width="1120" height="840" rx="16" fill="#0b1329" stroke="#1e3a8a" stroke-width="2" />
  <rect x="55" y="105" width="220" height="30" rx="6" fill="#1e3a8a" />
  <text x="65" y="125" fill="#e2e8f0" font-size="12" font-weight="700">AWS Custom VPC (10.0.0.0/16)</text>

  <!-- 1. PUBLIC SUBNETS (Zone A & B) -->
  <rect x="60" y="150" width="1080" height="120" rx="12" fill="#111c38" stroke="#2563eb" stroke-dasharray="4" stroke-width="1.5" />
  <text x="75" y="172" fill="#60a5fa" font-size="12" font-weight="700">PUBLIC SUBNETS (10.0.1.0/24 &amp; 10.0.2.0/24) — Multi-AZ</text>

  <!-- Internet Gateway & Traffic -->
  <g transform="translate(80, 190)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="90" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Internet Gateway (IGW)</text>
    <text x="90" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Public Inbound &amp; Egress</text>
  </g>

  <!-- Public ALB -->
  <g transform="translate(320, 190)" filter="url(#shadow)">
    <rect width="360" height="60" rx="8" fill="url(#cardGradBlue)" stroke="#38bdf8" stroke-width="2" />
    <text x="180" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">AWS Application Load Balancer (ALB)</text>
    <text x="180" y="45" fill="#93c5fd" font-size="11" text-anchor="middle">Dual AZs · TLS Termination · HTTP Ports 80 / 443</text>
  </g>

  <!-- NAT Gateway -->
  <g transform="translate(740, 190)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="90" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">NAT Gateway</text>
    <text x="90" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Private Node Outbound Egress</text>
  </g>

  <!-- SSM Admin -->
  <g transform="translate(950, 190)" filter="url(#shadow)">
    <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="85" y="26" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">AWS Systems Manager</text>
    <text x="85" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Session Manager (Zero SSH IPs)</text>
  </g>

  <!-- Flow Arrow: IGW -> ALB -->
  <line x1="260" y1="220" x2="310" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. PRIVATE SUBNETS & KUBERNETES CLUSTER -->
  <rect x="60" y="290" width="1080" height="620" rx="12" fill="#080e1e" stroke="#3b82f6" stroke-width="1.5" />
  <text x="75" y="312" fill="#93c5fd" font-size="12" font-weight="700">PRIVATE SUBNETS (10.0.10.0/24 &amp; 10.0.20.0/24) — KUBERNETES CLUSTER (Zero Public IPs)</text>

  <!-- Flow Arrow: ALB -> Ingress NGINX -->
  <path d="M 500 250 L 500 340" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <rect x="508" y="280" width="115" height="20" rx="4" fill="#1e293b" />
  <text x="565" y="294" fill="#38bdf8" font-size="10" text-anchor="middle">NodePort Range</text>

  <!-- Ingress Controller -->
  <g transform="translate(350, 345)" filter="url(#shadow)">
    <rect width="300" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="150" y="24" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Ingress Controller (ingress-nginx)</text>
    <text x="150" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">Routes: / ➔ web | /api ➔ catalog-api</text>
  </g>

  <!-- NAMESPACE: shoplite -->
  <rect x="80" y="415" width="670" height="475" rx="10" fill="#0d1b2a" stroke="#10b981" stroke-dasharray="3" stroke-width="1.5" />
  <rect x="95" y="425" width="190" height="24" rx="4" fill="#064e3b" />
  <text x="105" y="441" fill="#6ee7b7" font-size="11" font-weight="700">Namespace: shoplite (Workloads)</text>

  <!-- Web Frontend Pod -->
  <g transform="translate(100, 465)" filter="url(#shadow)">
    <rect width="210" height="85" rx="8" fill="url(#cardGradGreen)" stroke="#34d399" stroke-width="1.5" />
    <text x="105" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">web (2 Replicas)</text>
    <text x="105" y="42" fill="#a7f3d0" font-size="10" text-anchor="middle">Nginx Alpine · Static HTML/JS</text>
    <text x="105" y="58" fill="#a7f3d0" font-size="10" text-anchor="middle">Non-Root UID 10001 · Port 80</text>
    <text x="105" y="74" fill="#6ee7b7" font-size="9" text-anchor="middle">Ingress Path: /</text>
  </g>

  <!-- Catalog API Pod -->
  <g transform="translate(370, 465)" filter="url(#shadow)">
    <rect width="360" height="85" rx="8" fill="url(#cardGradGreen)" stroke="#34d399" stroke-width="2" />
    <text x="180" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">catalog-api (>= 2 Replicas)</text>
    <text x="180" y="42" fill="#a7f3d0" font-size="10" text-anchor="middle">FastAPI · Uvicorn · SQLAlchemy Async · OTel SDK</text>
    <text x="180" y="58" fill="#a7f3d0" font-size="10" text-anchor="middle">Non-Root UID 10001 · Port 8000 · PDB: minAvailable: 1</text>
    <text x="180" y="74" fill="#6ee7b7" font-size="9" text-anchor="middle">Ingress Path: /api | Probes: /healthz, /readyz</text>
  </g>

  <!-- Flow from Ingress to Pods -->
  <path d="M 430 395 L 430 435 L 205 435 L 205 460" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)" />
  <path d="M 570 395 L 570 460" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)" />

  <!-- Order Worker Pod -->
  <g transform="translate(100, 590)" filter="url(#shadow)">
    <rect width="260" height="90" rx="8" fill="url(#cardGradGreen)" stroke="#34d399" stroke-width="1.5" />
    <text x="130" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">order-worker (HPA: 1-4)</text>
    <text x="130" y="42" fill="#a7f3d0" font-size="10" text-anchor="middle">Asyncio Loop · Reliable Consumer</text>
    <text x="130" y="58" fill="#a7f3d0" font-size="10" text-anchor="middle">Simulates Work (1-2s) · Grace: 30s</text>
    <text x="130" y="74" fill="#6ee7b7" font-size="9" text-anchor="middle">Extracts W3C TraceContext · Non-Root</text>
  </g>

  <!-- Redis Queue Box -->
  <g transform="translate(420, 590)" filter="url(#shadow)">
    <rect width="310" height="90" rx="8" fill="url(#cardGradOrange)" stroke="#fb923c" stroke-width="1.5" />
    <text x="155" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">redis (ClusterIP: Port 6379)</text>
    <text x="155" y="42" fill="#fed7aa" font-size="10" text-anchor="middle">List: orders:pending (LPUSH)</text>
    <text x="155" y="58" fill="#fed7aa" font-size="10" text-anchor="middle">List: orders:processing (BRPOPLPUSH / LREM)</text>
    <text x="155" y="74" fill="#fdba74" font-size="9" text-anchor="middle">Protected by NetworkPolicy</text>
  </g>

  <!-- PostgreSQL StatefulSet -->
  <g transform="translate(250, 725)" filter="url(#shadow)">
    <rect width="360" height="95" rx="8" fill="url(#cardGradBlue)" stroke="#38bdf8" stroke-width="2" />
    <text x="180" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">postgres (StatefulSet · Port 5432)</text>
    <text x="180" y="44" fill="#bfdbfe" font-size="10" text-anchor="middle">PostgreSQL 16 Alpine · PersistentVolumeClaim (5Gi)</text>
    <text x="180" y="60" fill="#bfdbfe" font-size="10" text-anchor="middle">Auto-Seeded Products (>=10) · Orders Table</text>
    <text x="180" y="78" fill="#93c5fd" font-size="9" text-anchor="middle">NetworkPolicy: API &amp; Worker Ingress Only</text>
  </g>

  <!-- Application Flows -->
  <!-- API -> Redis (LPUSH) -->
  <path d="M 575 550 L 575 585" stroke="#fb923c" stroke-width="2" fill="none" marker-end="url(#arrowOrange)" />
  <text x="590" y="572" fill="#fb923c" font-size="10" font-weight="700">LPUSH</text>

  <!-- Redis -> Worker (BRPOPLPUSH) -->
  <path d="M 420 635 L 365 635" stroke="#fb923c" stroke-width="2" fill="none" marker-end="url(#arrowOrange)" />
  <text x="390" y="625" fill="#fb923c" font-size="9" font-weight="700" text-anchor="middle">BRPOPLPUSH</text>

  <!-- API -> Postgres -->
  <path d="M 460 550 L 460 720" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="468" y="705" fill="#38bdf8" font-size="9">INSERT PENDING</text>

  <!-- Worker -> Postgres -->
  <path d="M 230 680 L 230 765 L 245 765" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)" />
  <text x="210" y="735" fill="#34d399" font-size="9" text-anchor="end">UPDATE COMPLETED</text>

  <!-- NAMESPACE: monitoring -->
  <rect x="770" y="415" width="350" height="475" rx="10" fill="#1e1035" stroke="#a855f7" stroke-dasharray="3" stroke-width="1.5" />
  <rect x="785" y="425" width="220" height="24" rx="4" fill="#581c87" />
  <text x="795" y="441" fill="#e9d5ff" font-size="11" font-weight="700">Namespace: monitoring (Observability)</text>

  <!-- Prometheus & Alertmanager -->
  <g transform="translate(790, 465)" filter="url(#shadow)">
    <rect width="310" height="75" rx="8" fill="url(#cardGradPurple)" stroke="#c084fc" stroke-width="1.5" />
    <text x="155" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Prometheus &amp; Alertmanager</text>
    <text x="155" y="42" fill="#e9d5ff" font-size="10" text-anchor="middle">Scrapes /metrics via ServiceMonitor</text>
    <text x="155" y="58" fill="#d8b4fe" font-size="9" text-anchor="middle">5 Critical/Warning Rules with Runbook URLs</text>
  </g>

  <!-- Grafana Loki -->
  <g transform="translate(790, 555)" filter="url(#shadow)">
    <rect width="310" height="70" rx="8" fill="url(#cardGradPurple)" stroke="#c084fc" stroke-width="1.5" />
    <text x="155" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Grafana Loki &amp; Promtail / Alloy</text>
    <text x="155" y="42" fill="#e9d5ff" font-size="10" text-anchor="middle">Ingests Single-Line JSON logs from stdout</text>
    <text x="155" y="58" fill="#d8b4fe" font-size="9" text-anchor="middle">Derived Field: trace_id Regex Linked to Tempo</text>
  </g>

  <!-- Grafana Tempo -->
  <g transform="translate(790, 640)" filter="url(#shadow)">
    <rect width="310" height="70" rx="8" fill="url(#cardGradPurple)" stroke="#c084fc" stroke-width="1.5" />
    <text x="155" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Grafana Tempo (OTLP gRPC :4317)</text>
    <text x="155" y="42" fill="#e9d5ff" font-size="10" text-anchor="middle">Distributed Spans: API ➔ Queue ➔ Worker ➔ DB</text>
    <text x="155" y="58" fill="#d8b4fe" font-size="9" text-anchor="middle">W3C TraceContext Trace Visualization</text>
  </g>

  <!-- Grafana Dashboards -->
  <g transform="translate(790, 725)" filter="url(#shadow)">
    <rect width="310" height="85" rx="8" fill="url(#cardGradPurple)" stroke="#e879f9" stroke-width="2" />
    <text x="155" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Grafana Golden Signals Dashboard</text>
    <text x="155" y="44" fill="#f5d0fe" font-size="10" text-anchor="middle">p50/p95/p99 Latency · RPS · 5xx Error Rate</text>
    <text x="155" y="60" fill="#f5d0fe" font-size="10" text-anchor="middle">Queue Depth · Worker Replicas · CPU/Memory</text>
    <text x="155" y="76" fill="#e879f9" font-size="9" text-anchor="middle">One-Click Triage: Alert ➔ Metric ➔ Log ➔ Trace</text>
  </g>

  <!-- Telemetry Link Arrows (catalog-api & worker to monitoring) -->
  <path d="M 730 495 L 785 495" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3" fill="none" marker-end="url(#arrowPurple)" />
  <path d="M 730 585 L 760 585 L 760 670 L 785 670" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3" fill="none" marker-end="url(#arrowPurple)" />
</svg>
